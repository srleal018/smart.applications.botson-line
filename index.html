<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Smart Applications
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        :root {

            --primary:
                #5865F2;

            --primary-dark:
                #4752C4;

            --background:
                #080A12;

            --surface:
                #111827;

            --card:
                rgba(17, 24, 39, 0.75);

            --border:
                rgba(255,255,255,0.08);

            --text:
                #F9FAFB;

            --muted:
                #9CA3AF;

            --success:
                #10B981;

            --danger:
                #EF4444;

            --warning:
                #F59E0B;

        }

        * {

            margin:
                0;

            padding:
                0;

            box-sizing:
                border-box;

        }

        body {

            background:
                var(--background);

            color:
                var(--text);

            font-family:
                'Inter',
                sans-serif;

        }

        header {

            width:
                100%;

            min-height:
                320px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-direction:
                column;

            text-align:
                center;

            padding:
                30px;

            border-bottom:
                1px solid var(--border);

            background:
                radial-gradient(
                    circle at top right,
                    rgba(88,101,242,.25),
                    transparent 40%
                ),
                linear-gradient(
                    to bottom,
                    #0f172a,
                    #080A12
                );

        }

        .status-badge {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            padding:
                8px 18px;

            border-radius:
                999px;

            border:
                1px solid var(--success);

            background:
                rgba(16,185,129,.1);

            color:
                var(--success);

            font-size:
                13px;

            font-weight:
                700;

            margin-bottom:
                18px;

        }

        header h1 {

            font-size:
                clamp(
                    34px,
                    5vw,
                    58px
                );

            font-weight:
                800;

            letter-spacing:
                -2px;

        }

        header p {

            margin-top:
                15px;

            max-width:
                700px;

            color:
                var(--muted);

            font-size:
                17px;

            line-height:
                1.7;

        }

        .search-box {

            width:
                92%;

            max-width:
                700px;

            margin:
                -35px auto 0;

            position:
                relative;

            z-index:
                10;

        }

        .search-box input {

            width:
                100%;

            padding:
                18px 20px 18px 58px;

            border-radius:
                18px;

            border:
                1px solid var(--border);

            background:
                var(--surface);

            color:
                white;

            font-size:
                15px;

            outline:
                none;

            transition:
                .25s;

            box-shadow:
                0 20px 50px rgba(0,0,0,.45);

        }

        .search-box input:focus {

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 4px rgba(88,101,242,.2);

        }

        .search-icon {

            position:
                absolute;

            left:
                18px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                var(--muted);

        }

        .container {

            width:
                100%;

            max-width:
                1450px;

            margin:
                60px auto;

            padding:
                0 20px;

            display:
                grid;

            grid-template-columns:
                280px 1fr;

            gap:
                35px;

        }

        .sidebar {

            position:
                sticky;

            top:
                20px;

            height:
                fit-content;

        }

        .sidebar-card {

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                18px;

            padding:
                20px;

        }

        .sidebar-title {

            color:
                var(--muted);

            font-size:
                12px;

            font-weight:
                700;

            margin-bottom:
                15px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

        }

        .menu-item {

            width:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                12px;

            border-radius:
                12px;

            margin-bottom:
                8px;

            cursor:
                pointer;

            transition:
                .2s;

            color:
                var(--muted);

        }

        .menu-item:hover {

            background:
                rgba(255,255,255,.04);

            color:
                white;

        }

        .menu-item.active {

            background:
                var(--primary);

            color:
                white;

            font-weight:
                700;

        }

        .pill {

            background:
                rgba(0,0,0,.25);

            padding:
                4px 10px;

            border-radius:
                999px;

            font-size:
                12px;

        }

        .grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(340px, 1fr)
                );

            gap:
                24px;

        }

        .card {

            position:
                relative;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:
                24px;

            padding:
                24px;

            backdrop-filter:
                blur(10px);

            transition:
                .25s;

            overflow:
                hidden;

        }

        .card:hover {

            transform:
                translateY(-5px);

            border-color:
                var(--primary);

        }

        .card::before {

            content:
                '';

            position:
                absolute;

            inset:
                0;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(88,101,242,.15),
                    transparent 45%
                );

            pointer-events:
                none;

        }

        .status {

            position:
                absolute;

            top:
                18px;

            right:
                18px;

            padding:
                6px 12px;

            border-radius:
                999px;

            font-size:
                11px;

            font-weight:
                700;

            text-transform:
                uppercase;

        }

        .online {

            background:
                rgba(16,185,129,.12);

            border:
                1px solid var(--success);

            color:
                var(--success);

        }

        .offline {

            background:
                rgba(239,68,68,.12);

            border:
                1px solid var(--danger);

            color:
                var(--danger);

        }

        .card h2 {

            font-size:
                23px;

            margin-bottom:
                6px;

        }

        .bot-id {

            color:
                var(--muted);

            font-size:
                13px;

            font-family:
                monospace;

        }

        .stats {

            margin-top:
                22px;

            background:
                rgba(0,0,0,.22);

            border-radius:
                16px;

            padding:
                16px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                14px;

        }

        .row {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                10px;

        }

        .row-left {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            color:
                var(--muted);

            font-size:
                14px;

        }

        .row-value {

            font-weight:
                700;

            text-align:
                right;

        }

        .warn {

            color:
                var(--warning);

        }

        .danger {

            color:
                var(--danger);

        }

        .button {

            width:
                100%;

            margin-top:
                18px;

            border:
                none;

            border-radius:
                14px;

            padding:
                14px;

            background:
                var(--primary);

            color:
                white;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                .2s;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

        }

        .button:hover {

            background:
                var(--primary-dark);

            transform:
                scale(1.02);

        }

        .loader {

            width:
                100%;

            padding:
                120px 20px;

            text-align:
                center;

            color:
                var(--muted);

        }

        .spin {

            animation:
                spin 1s linear infinite;

        }

        @keyframes spin {

            100% {

                transform:
                    rotate(360deg);

            }

        }

        @media (
            max-width: 950px
        ) {

            .container {

                grid-template-columns:
                    1fr;

            }

            .sidebar {

                display:
                    none;

            }

        }

    </style>

</head>

<body>

    <header>

        <div
            class="status-badge"
            id="statusBadge"
        >

            <i
                data-lucide="loader-2"
                class="spin"
                size="15"
            ></i>

            Conectando ao Firebase...

        </div>

        <h1>
            Smart Applications
        </h1>

        <p>
            Painel profissional sincronizado em tempo real
            com o Firebase para gerenciamento completo
            de bots, mensalidades e status.
        </p>

    </header>

    <div class="search-box">

        <i
            data-lucide="search"
            class="search-icon"
            size="20"
        ></i>

        <input
            type="text"
            id="search"
            placeholder="Pesquisar por nome ou ID..."
        />

    </div>

    <div class="container">

        <aside class="sidebar">

            <div class="sidebar-card">

                <div class="sidebar-title">
                    Dashboard
                </div>

                <div
                    class="menu-item active"
                    onclick="filtrar('all', event)"
                >

                    <span>
                        Todos os Bots
                    </span>

                    <span
                        class="pill"
                        id="count-all"
                    >
                        0
                    </span>

                </div>

                <div
                    class="menu-item"
                    onclick="filtrar('online', event)"
                >

                    <span>
                        Online
                    </span>

                    <span
                        class="pill"
                        id="count-online"
                    >
                        0
                    </span>

                </div>

                <div
                    class="menu-item"
                    onclick="filtrar('vencendo', event)"
                >

                    <span>
                        Vencendo
                    </span>

                    <span
                        class="pill"
                        id="count-warn"
                    >
                        0
                    </span>

                </div>

            </div>

        </aside>

        <main
            class="grid"
            id="grid"
        >

            <div class="loader">

                <i
                    data-lucide="loader-2"
                    class="spin"
                    size="42"
                ></i>

                <p>
                    Sincronizando banco...
                </p>

            </div>

        </main>

    </div>

    <script>

        const FIREBASE_URL =
            'https://smart-applications-6ced1-default-rtdb.firebaseio.com/bots.json';

        let bots =
            [];

        async function carregarBots() {

            try {

                const req =
                    await fetch(
                        FIREBASE_URL
                    );

                const data =
                    await req.json();

                if (!data) {

                    document
                        .getElementById(
                            'grid'
                        )
                        .innerHTML =
                        `
                        <div class="loader">
                            Nenhum bot encontrado.
                        </div>
                        `;

                    return;

                }

                bots =
                    Object.keys(data).map(id => ({

                        id,

                        ...data[id]

                    }));

                atualizarContadores();

                renderizar(
                    bots
                );

                const badge =
                    document.getElementById(
                        'statusBadge'
                    );

                badge.innerHTML =
                    `
                    <i data-lucide="check-circle" size="15"></i>
                    Banco sincronizado
                    `;

            }

            catch (err) {

                console.log(err);

                document
                    .getElementById(
                        'grid'
                    )
                    .innerHTML =
                    `
                    <div class="loader">
                        ❌ Erro ao conectar no Firebase
                    </div>
                    `;

            }

            lucide.createIcons();

        }

        function diasRestantes(data) {

            const hoje =
                new Date();

            const vencimento =
                new Date(data);

            const diff =
                vencimento - hoje;

            return Math.ceil(
                diff / (
                    1000 *
                    60 *
                    60 *
                    24
                )
            );

        }

        function renderizar(lista) {

            const grid =
                document.getElementById(
                    'grid'
                );

            grid.innerHTML =
                '';

            lista.forEach(bot => {

                const dias =
                    diasRestantes(
                        bot.vencimento
                    );

                let classePrazo =
                    '';

                let textoPrazo =
                    `${dias} dias restantes`;

                if (dias <= 5) {

                    classePrazo =
                        'warn';

                    textoPrazo =
                        `Vence em ${dias} dias`;

                }

                if (dias <= 0) {

                    classePrazo =
                        'danger';

                    textoPrazo =
                        'Mensalidade vencida';

                }

                const online =
                    bot.status ===
                    'online';

                const card =
                    document.createElement(
                        'div'
                    );

                card.className =
                    'card';

                card.innerHTML =
                    `
                    <div class="status ${online ? 'online' : 'offline'}">
                        ${online ? 'ONLINE' : 'OFFLINE'}
                    </div>

                    <h2>
                        ${bot.nome || 'Bot sem nome'}
                    </h2>

                    <div class="bot-id">
                        ID: ${bot.id}
                    </div>

                    <div class="stats">

                        <div class="row">

                            <div class="row-left">

                                <i data-lucide="shield-check" size="16"></i>

                                Plano

                            </div>

                            <div class="row-value">
                                ${bot.plano || '---'}
                            </div>

                        </div>

                        <div class="row">

                            <div class="row-left">

                                <i data-lucide="calendar-days" size="16"></i>

                                Vencimento

                            </div>

                            <div class="row-value">
                                ${bot.vencimento}
                            </div>

                        </div>

                        <div class="row">

                            <div class="row-left">

                                <i data-lucide="clock-3" size="16"></i>

                                Status prazo

                            </div>

                            <div class="row-value ${classePrazo}">
                                ${textoPrazo}
                            </div>

                        </div>

                        <div class="row">

                            <div class="row-left">

                                <i data-lucide="user" size="16"></i>

                                Cliente

                            </div>

                            <div class="row-value">
                                ${bot.cliente || '---'}
                            </div>

                        </div>

                    </div>

                    <button class="button">

                        <i data-lucide="external-link" size="17"></i>

                        GERENCIAR BOT

                    </button>
                    `;

                grid.appendChild(
                    card
                );

            });

            lucide.createIcons();

        }

        function atualizarContadores() {

            document
                .getElementById(
                    'count-all'
                )
                .innerText =
                bots.length;

            document
                .getElementById(
                    'count-online'
                )
                .innerText =
                bots.filter(
                    bot =>
                    bot.status ===
                    'online'
                ).length;

            document
                .getElementById(
                    'count-warn'
                )
                .innerText =
                bots.filter(bot => {

                    const dias =
                        diasRestantes(
                            bot.vencimento
                        );

                    return dias <= 5;

                }).length;

        }

        function filtrar(tipo, event) {

            document
                .querySelectorAll(
                    '.menu-item'
                )
                .forEach(item => {

                    item.classList.remove(
                        'active'
                    );

                });

            event.currentTarget
                .classList.add(
                    'active'
                );

            if (tipo === 'all') {

                renderizar(
                    bots
                );

            }

            if (tipo === 'online') {

                renderizar(

                    bots.filter(bot =>
                        bot.status ===
                        'online'
                    )

                );

            }

            if (tipo === 'vencendo') {

                renderizar(

                    bots.filter(bot => {

                        const dias =
                            diasRestantes(
                                bot.vencimento
                            );

                        return dias <= 5;

                    })

                );

            }

        }

        document
            .getElementById(
                'search'
            )

            .addEventListener(
                'input',
                e => {

                    const termo =
                        e.target.value
                            .toLowerCase();

                    const filtrados =
                        bots.filter(bot =>

                            bot.nome
                                ?.toLowerCase()
                                .includes(
                                    termo
                                )

                            ||

                            bot.id
                                .toLowerCase()
                                .includes(
                                    termo
                                )

                        );

                    renderizar(
                        filtrados
                    );

                }
            );

        carregarBots();

        setInterval(
            carregarBots,
            60000
        );

    </script>

</body>
</html>
