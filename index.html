<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente de Atas — Grêmio Estudantil</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6fb; color: #1c2333; }
    header { background: #1f3b8a; color: #fff; padding: 20px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 14px; opacity: .85; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 24px; align-items: start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd2e1;
      border-radius: 6px; font: inherit; }
    textarea { min-height: 200px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    button { margin-top: 16px; background: #1f3b8a; color: #fff; border: 0; border-radius: 6px;
      padding: 10px 18px; font-size: 15px; cursor: pointer; }
    button:hover { background: #162c69; }
    button:disabled { opacity: .6; cursor: wait; }
    .acoes button { margin-right: 8px; background: #e5e9f5; color: #1f3b8a; }
    pre { white-space: pre-wrap; word-wrap: break-word; font-family: ui-monospace, monospace; font-size: 13px; }
    .erro { background: #fde8e8; color: #8a1f1f; padding: 10px 12px; border-radius: 6px; }
    .aviso { background: #fff7e0; color: #7a5d00; padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-top: 10px; }
    .vazio { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Agente de Atas — Grêmio Estudantil</h1>
    <p>Transforme anotações de reunião ou de ação em uma ata formal.</p>
  </header>
  <main>
    <form class="card" id="form">
      <label for="apikey">Chave da API Groq (fica salva só neste navegador)</label>
      <input id="apikey" type="password" placeholder="gsk_..." autocomplete="off">
      <div class="aviso">Crie sua chave gratuita em console.groq.com/keys. Nunca publique a chave em sites ou repositórios.</div>
      <div class="grid2">
        <div>
          <label for="tipo">Tipo de documento</label>
          <select id="tipo">
            <option value="reunião">Reunião ordinária</option>
            <option value="reunião extraordinária">Reunião extraordinária</option>
            <option value="assembleia geral">Assembleia geral</option>
            <option value="ação/evento">Ação / evento</option>
          </select>
        </div>
        <div>
          <label for="gremio">Nome do grêmio</label>
          <input id="gremio" placeholder="Grêmio Estudantil ...">
        </div>
        <div>
          <label for="numero">Número da ata</label>
          <input id="numero" placeholder="012/2026">
        </div>
        <div>
          <label for="data">Data</label>
          <input id="data" placeholder="20/03/2026">
        </div>
      </div>
      <label for="local">Local</label>
      <input id="local" placeholder="Sala 12 — Bloco B">
      <label for="anotacoes">Anotações brutas *</label>
      <textarea id="anotacoes" required
        placeholder="Cole aqui os tópicos, a transcrição ou as anotações da reunião..."></textarea>
      <label for="observacoes">Observações adicionais</label>
      <input id="observacoes">
      <button type="submit" id="gerar">Gerar ata</button>
    </form>
    <section class="card">
      <h2 style="margin-top:0;font-size:16px;">Ata gerada</h2>
      <div id="erro" class="erro" hidden></div>
      <p id="placeholder" class="vazio">Preencha o formulário e clique em “Gerar ata”.</p>
      <pre id="ata" hidden></pre>
      <div class="acoes">
        <button type="button" id="copiar" hidden>Copiar</button>
        <button type="button" id="baixar" hidden>Baixar .md</button>
      </div>
    </section>
  </main>
  <script>
    const SYSTEM_PROMPT = `Você é um agente especializado em redigir ATAS oficiais de um Grêmio Estudantil brasileiro.
Sua única função é transformar anotações informais, transcrições ou tópicos soltos em uma ata formal,
clara e juridicamente bem estruturada, em português do Brasil.

REGRAS DE REDAÇÃO
1. Linguagem formal, impessoal e objetiva, na terceira pessoa e no pretérito perfeito
   ("o presidente declarou aberta a sessão", "os presentes deliberaram").
2. Nunca invente fatos, nomes, números, valores ou votos que não estejam nas anotações.
   Quando um dado obrigatório faltar, escreva o marcador [A PREENCHER: descrição do dado].
3. Não use gírias, emojis, primeira pessoa, opiniões ou juízo de valor.
4. Datas por extenso no cabeçalho ("aos vinte de março de dois mil e vinte e seis") e horários
   no formato 24h ("às 14h30").
5. Deliberações devem registrar a forma de decisão e o placar quando informado
   ("aprovada por 8 votos favoráveis, 1 contrário e 2 abstenções").
6. Encaminhamentos sempre com responsável e prazo; se não houver, use [A PREENCHER: responsável/prazo].
7. Saída em Markdown, sem comentários seus, sem explicações e sem blocos de código.

ESTRUTURA OBRIGATÓRIA DA ATA
# ATA DE {TIPO} — GRÊMIO ESTUDANTIL {NOME}
**Nº da ata:** ... | **Data:** ... | **Horário de início:** ... | **Local:** ...

## 1. Abertura
Parágrafo de abertura com data por extenso, local, horário e quem presidiu a sessão.

## 2. Presenças
- **Presentes:** lista de nomes e cargos
- **Ausentes justificados:** ...
- **Ausentes não justificados:** ...
- **Quórum:** informar se foi atingido

## 3. Pauta
Lista numerada dos itens previstos.

## 4. Desenvolvimento e discussões
Um subitem por assunto (### 4.1, ### 4.2 ...), em parágrafos corridos, registrando falas
relevantes de forma indireta e os principais argumentos.

## 5. Deliberações
Lista numerada das decisões, cada uma com forma de aprovação e placar.

## 6. Encaminhamentos
Tabela com as colunas: Ação | Responsável | Prazo.

## 7. Encerramento
Parágrafo de encerramento com horário do término e menção à lavratura da ata.

## 8. Assinaturas
Linhas de assinatura para presidente, secretário(a) e demais membros que assinaram.

Se as anotações forem de uma ata de AÇÃO/EVENTO (e não de reunião), adapte as seções 3 a 6 para:
"3. Objetivo da ação", "4. Descrição da execução", "5. Resultados e participação",
"6. Pendências e encaminhamentos", mantendo o restante da estrutura.`;

    const $ = id => document.getElementById(id);
    $('apikey').value = localStorage.getItem('groq_api_key') || '';

    function buildUserPrompt() {
      const campos = [
        ['Tipo de documento', $('tipo').value],
        ['Nome do grêmio', $('gremio').value],
        ['Número da ata', $('numero').value],
        ['Data da sessão', $('data').value],
        ['Local', $('local').value],
        ['Observações adicionais', $('observacoes').value],
      ].filter(([, v]) => v.trim());
      const cab = campos.map(([r, v]) => `- ${r}: ${v}`).join('\n') || '- (nenhum informado)';
      return `Gere a ata a partir das informações abaixo.\n\nMETADADOS\n${cab}\n\nANOTAÇÕES BRUTAS\n"""\n${$('anotacoes').value.trim()}\n"""`;
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = $('apikey').value.trim();
      const erro = $('erro');
      erro.hidden = true;
      if (!key) { erro.textContent = 'Informe a chave da API Groq.'; erro.hidden = false; return; }
      localStorage.setItem('groq_api_key', key);
      const botao = $('gerar');
      botao.disabled = true;
      botao.textContent = 'Gerando...';
      try {
        const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            temperature: 0.2,
            max_tokens: 4096,
            messages: [
              { role: 'system', content: SYSTEM_PROMPT },
              { role: 'user', content: buildUserPrompt() },
            ],
          }),
        });
        if (!resp.ok) {
          const corpo = await resp.text();
          throw new Error(resp.status === 401
            ? 'Chave da API inválida ou revogada. Gere uma nova em console.groq.com/keys.'
            : `Erro ${resp.status} da API Groq: ${corpo.slice(0, 300)}`);
        }
        const data = await resp.json();
        const ata = (data.choices?.[0]?.message?.content || '').trim();
        if (!ata) throw new Error('A API não retornou conteúdo.');
        $('ata').textContent = ata;
        $('ata').hidden = false;
        $('placeholder').hidden = true;
        $('copiar').hidden = false;
        $('baixar').hidden = false;
      } catch (err) {
        erro.textContent = err.message;
        erro.hidden = false;
      } finally {
        botao.disabled = false;
        botao.textContent = 'Gerar ata';
      }
    });

    $('copiar').addEventListener('click', () =>
      navigator.clipboard.writeText($('ata').textContent));

    $('baixar').addEventListener('click', () => {
      const blob = new Blob([$('ata').textContent + '\n'], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ata.md';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
