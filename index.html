<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Applications
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        :root {

            --primary: #5865F2;
            --background: #080A12;
            --surface: #111827;
            --card: rgba(17,24,39,.75);
            --border: rgba(255,255,255,.08);
            --text: #F9FAFB;
            --muted: #9CA3AF;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;

        }

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {

            background: var(--background);
            color: var(--text);
            font-family: 'Inter', sans-serif;

        }

        header {

            padding: 80px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);

            background:
                radial-gradient(circle at top right,
                rgba(88,101,242,.25),
                transparent 40%),
                linear-gradient(to bottom,
                #0f172a,
                #080A12);

        }

        header h1 {

            font-size: 56px;
            font-weight: 800;

        }

        header p {

            margin-top: 15px;
            color: var(--muted);

        }

        .container {

            max-width: 1400px;
            margin: auto;
            padding: 40px 20px;

        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(340px,1fr)
                );

            gap: 24px;

        }

        .card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 24px;

            padding: 24px;

            position: relative;

            overflow: hidden;

            transition: .25s;

            backdrop-filter: blur(10px);

        }

        .card:hover {

            transform: translateY(-6px);

            border-color: var(--primary);

        }

        .status {

            position: absolute;

            top: 18px;
            right: 18px;

            padding: 6px 12px;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 700;

        }

        .online {

            background: rgba(16,185,129,.12);

            color: var(--success);

            border: 1px solid var(--success);

        }

        .offline {

            background: rgba(239,68,68,.12);

            color: var(--danger);

            border: 1px solid var(--danger);

        }

        .card h2 {

            font-size: 24px;
            margin-bottom: 8px;

        }

        .bot-id {

            color: var(--muted);
            font-size: 13px;

        }

        .stats {

            margin-top: 22px;

            display: flex;
            flex-direction: column;

            gap: 12px;

            background: rgba(0,0,0,.2);

            padding: 18px;

            border-radius: 16px;

        }

        .row {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        .row span {

            color: var(--muted);

        }

        .button {

            width: 100%;

            margin-top: 18px;

            border: none;

            background: var(--primary);

            color: white;

            padding: 14px;

            border-radius: 14px;

            cursor: pointer;

            font-weight: 700;

            transition: .2s;

        }

        .button:hover {

            transform: scale(1.02);

        }

        .modal-overlay {

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.7);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 999;

            backdrop-filter: blur(8px);

        }

        .modal {

            width: 100%;

            max-width: 700px;

            background: #111827;

            border-radius: 24px;

            border: 1px solid rgba(255,255,255,.08);

            overflow: hidden;

        }

        .modal-header {

            padding: 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom:
                1px solid rgba(255,255,255,.08);

        }

        .modal-header button {

            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;

        }

        .modal-content {

            padding: 24px;

            display: grid;

            gap: 16px;

        }

        .modal-box {

            background: rgba(255,255,255,.03);

            border-radius: 16px;

            padding: 16px;

        }

        .modal-box span {

            color: var(--muted);
            font-size: 13px;

        }

        .modal-box h3 {

            margin-top: 6px;

        }

    </style>

</head>

<body>

    <header>

        <h1>
            Smart Applications
        </h1>

        <p>
            Dashboard premium conectado em tempo real.
        </p>

    </header>

    <div class="container">

        <div
            class="grid"
            id="grid"
        ></div>

    </div>

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <div class="modal">

            <div class="modal-header">

                <h2 id="modalNome">
                    BOT
                </h2>

                <button onclick="fecharModal()">
                    ✕
                </button>

            </div>

            <div
                class="modal-content"
                id="modalContent"
            ></div>

        </div>

    </div>

    <script src="./config.js"></script>

    <script>

        let bots = [];

        async function carregarBots() {

            const req =
                await fetch(FIREBASE_URL);

            const data =
                await req.json();

            bots =
                Object.keys(data || {}).map(id => ({

                    id,
                    ...data[id]

                }));

            renderizar();

        }

        function renderizar() {

            const grid =
                document.getElementById('grid');

            grid.innerHTML = '';

            bots.forEach(bot => {

                const online =
                    bot.status === 'online';

                const card =
                    document.createElement('div');

                card.className = 'card';

                card.innerHTML = `

                    <div class="status ${online ? 'online' : 'offline'}">
                        ${online ? 'ONLINE' : 'OFFLINE'}
                    </div>

                    <h2>
                        ${bot.nome}
                    </h2>

                    <div class="bot-id">
                        ID: ${bot.id}
                    </div>

                    <div class="stats">

                        <div class="row">
                            <span>Cliente</span>
                            <strong>${bot.cliente}</strong>
                        </div>

                        <div class="row">
                            <span>Plano</span>
                            <strong>${bot.plano}</strong>
                        </div>

                        <div class="row">
                            <span>Vencimento</span>
                            <strong>${bot.vencimento}</strong>
                        </div>

                    </div>

                    <button
                        class="button"
                        onclick="abrirModal('${bot.id}')"
                    >

                        MAIS...

                    </button>

                `;

                grid.appendChild(card);

            });

            lucide.createIcons();

        }

        function abrirModal(id) {

            const bot =
                bots.find(b => b.id === id);

            document
                .getElementById('modalNome')
                .innerText =
                bot.nome;

            document
                .getElementById('modalContent')
                .innerHTML = `

                    <div class="modal-box">
                        <span>Cliente</span>
                        <h3>${bot.cliente}</h3>
                    </div>

                    <div class="modal-box">
                        <span>Status</span>
                        <h3>${bot.status}</h3>
                    </div>

                    <div class="modal-box">
                        <span>RAM</span>
                        <h3>${bot.ram || '---'}</h3>
                    </div>

                    <div class="modal-box">
                        <span>CPU</span>
                        <h3>${bot.cpu || '---'}</h3>
                    </div>

                    <div class="modal-box">
                        <span>Servidores</span>
                        <h3>${bot.servidores || 0}</h3>
                    </div>

                    <div class="modal-box">
                        <span>Comandos</span>
                        <h3>${bot.comandos || 0}</h3>
                    </div>

            `;

            document
                .getElementById('modalOverlay')
                .style.display =
                'flex';

        }

        function fecharModal() {

            document
                .getElementById('modalOverlay')
                .style.display =
                'none';

        }

        carregarBots();

    </script>

</body>
</html>
