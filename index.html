<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Applications
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {

            --primary: #5865F2;
            --background: #080A12;
            --card: #111827;
            --border: rgba(255,255,255,.08);
            --text: #F9FAFB;
            --muted: #9CA3AF;
            --success: #10B981;
            --danger: #EF4444;

        }

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {

            background: var(--background);
            color: var(--text);
            font-family: 'Inter', sans-serif;

        }

        header {

            padding: 90px 20px;

            text-align: center;

            border-bottom:
                1px solid var(--border);

            background:
                radial-gradient(
                    circle at top right,
                    rgba(88,101,242,.25),
                    transparent 40%
                ),
                linear-gradient(
                    to bottom,
                    #0f172a,
                    #080A12
                );

        }

        header h1 {

            font-size: 60px;
            font-weight: 800;

        }

        header p {

            margin-top: 16px;

            color: var(--muted);

            font-size: 16px;

        }

        .container {

            max-width: 1400px;

            margin: auto;

            padding: 40px 20px;

        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(330px,1fr)
                );

            gap: 24px;

        }

        .card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 24px;

            padding: 24px;

            transition: .25s;

        }

        .card:hover {

            transform: translateY(-6px);

            border-color: var(--primary);

        }

        .status {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 700;

            margin-bottom: 18px;

        }

        .online {

            background: rgba(16,185,129,.12);

            border: 1px solid var(--success);

            color: var(--success);

        }

        .offline {

            background: rgba(239,68,68,.12);

            border: 1px solid var(--danger);

            color: var(--danger);

        }

        .card h2 {

            font-size: 25px;

            margin-bottom: 20px;

        }

        .info {

            display: flex;

            flex-direction: column;

            gap: 14px;

        }

        .row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 14px;

            border-radius: 14px;

            background: rgba(255,255,255,.03);

        }

        .row span {

            color: var(--muted);

            font-size: 14px;

        }

        .row strong {

            font-size: 14px;

        }

        .loader {

            width: 100%;

            text-align: center;

            padding: 120px 20px;

            color: var(--muted);

        }

    </style>

</head>

<body>

    <header>

        <h1>
            Smart Applications
        </h1>

        <p>
            Painel profissional em tempo real.
        </p>

    </header>

    <div class="container">

        <div
            class="grid"
            id="grid"
        >

            <div class="loader">
                Carregando bots...
            </div>

        </div>

    </div>

    <script>

        const FIREBASE_URL =
        'https://smart-applications-6ced1-default-rtdb.firebaseio.com/bots.json';

        let bots = [];

        async function carregarBots() {

            try {

                const req =
                    await fetch(FIREBASE_URL);

                const data =
                    await req.json();

                bots =
                    Object.keys(data || {}).map(id => ({

                        id,
                        ...data[id]

                    }));

                renderizar();

            }

            catch {

                document
                    .getElementById('grid')
                    .innerHTML =
                    `
                    <div class="loader">
                        Erro ao carregar banco.
                    </div>
                    `;

            }

        }

        function renderizar() {

            const grid =
                document.getElementById('grid');

            grid.innerHTML = '';

            bots.forEach(bot => {

                const online =
                    bot.status === 'online';

                const card =
                    document.createElement('div');

                card.className =
                    'card';

                card.innerHTML = `

                    <div class="status ${online ? 'online' : 'offline'}">

                        ${online ? 'ONLINE' : 'OFFLINE'}

                    </div>

                    <h2>

                        ${bot.nome || 'Bot'}

                    </h2>

                    <div class="info">

                        <div class="row">

                            <span>
                                Cliente
                            </span>

                            <strong>
                                ${bot.cliente || '---'}
                            </strong>

                        </div>

                        <div class="row">

                            <span>
                                Função
                            </span>

                            <strong>
                                ${bot.funcao || '---'}
                            </strong>

                        </div>

                        <div class="row">

                            <span>
                                Vencimento
                            </span>

                            <strong>
                                ${bot.vencimento || '---'}
                            </strong>

                        </div>

                    </div>

                `;

                grid.appendChild(card);

            });

        }

        carregarBots();

        setInterval(
            carregarBots,
            60000
        );

    </script>

</body>
</html>
