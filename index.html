<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | Smart Applications</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ===== VARIÁVEIS DO SISTEMA ===== */
        :root {
            --primary: #5865F2;
            --primary-glow: rgba(88, 101, 242, 0.3);
            --bg-deep: #080a12;
            --bg-surface: #111827;
            --bg-card: rgba(22, 27, 34, 0.7);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            
            /* Status Colors */
            --status-on: #10b981;
            --status-on-glow: rgba(16, 185, 129, 0.2);
            --status-off: #ef4444;
            --status-off-glow: rgba(239, 68, 68, 0.2);
            --status-warn: #f59e0b;
            --status-warn-glow: rgba(245, 158, 11, 0.2);
        }

        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Barra de Progresso do Header */
        #progress-bar {
            position: fixed; top: 0; left: 0; width: 0%; height: 4px;
            background: linear-gradient(to right, var(--primary), #a5b4fc);
            z-index: 1000; transition: width 0.1s;
        }

        /* ===== HEADER DINÂMICO ===== */
        header {
            height: 350px;
            background: radial-gradient(circle at top right, rgba(88, 101, 242, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(31, 41, 55, 1), var(--bg-deep));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; border-bottom: 1px solid var(--border);
            padding: 20px;
        }

        .badge {
            background: var(--primary-glow);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 16px;
            border: 1px solid var(--primary);
            display: flex; align-items: center; gap: 8px;
        }

        header h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; letter-spacing: -1.5px; margin-bottom: 15px; }
        header p { color: var(--text-muted); max-width: 600px; font-size: 18px; }

        /* ===== BUSCA ===== */
        .search-container {
            max-width: 600px; width: 90%; margin: -30px auto 0; position: relative; z-index: 10;
        }
        .search-container input {
            width: 100%; padding: 18px 25px 18px 50px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white; font-size: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            outline: none; transition: 0.3s;
        }
        .search-container input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* ===== LAYOUT PRINCIPAL ===== */
        .main-grid {
            display: grid; grid-template-columns: 280px 1fr;
            max-width: 1400px; margin: 60px auto; gap: 40px; padding: 0 20px;
        }

        /* ===== SIDEBAR NAV ===== */
        .sidebar { position: sticky; top: 40px; height: fit-content; }
        .nav-card {
            background: var(--bg-surface); padding: 25px;
            border-radius: 16px; border: 1px solid var(--border);
        }
        .nav-card h3 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; letter-spacing: 1px; }
        
        .nav-link {
            display: flex; align-items: center; justify-content: space-between;
            color: var(--text-muted); text-decoration: none;
            padding: 12px; border-radius: 8px; transition: 0.2s; margin-bottom: 4px;
            cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
            font-size: 15px; font-family: inherit;
        }
        .nav-link .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-link:hover { background: rgba(255,255,255,0.03); color: white; }
        .nav-link.active { background: var(--primary); color: white; font-weight: 600; box-shadow: 0 4px 12px var(--primary-glow); }
        .nav-count { background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 10px; font-size: 12px; }

        /* ===== GRID DE BOTS ===== */
        .content-area { min-width: 0; }
        
        .top-stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;
        }
        .stat-card {
            background: var(--bg-surface); border: 1px solid var(--border);
            padding: 20px; border-radius: 16px; display: flex; align-items: center; gap: 15px;
        }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .stat-info h4 { color: var(--text-muted); font-size: 13px; text-transform: uppercase; margin-bottom: 5px; }
        .stat-info span { font-size: 24px; font-weight: 700; color: white; }

        .bots-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
        }

        .bot-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 25px;
            transition: all 0.3s; position: relative;
            display: flex; flex-direction: column; gap: 20px;
        }
        .bot-card:hover { border-color: rgba(88, 101, 242, 0.4); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .bot-header { display: flex; align-items: center; gap: 15px; }
        .bot-avatar { 
            width: 50px; height: 50px; border-radius: 12px; background: var(--bg-surface);
            display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);
        }
        .bot-title h3 { font-size: 18px; color: white; margin-bottom: 4px; }
        .bot-id { font-size: 12px; color: var(--text-muted); font-family: monospace; }

        .status-badge {
            position: absolute; top: 25px; right: 25px;
            padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
        }
        .status-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; }
        
        .status-online { background: var(--status-on-glow); color: var(--status-on); border: 1px solid var(--status-on); }
        .status-online::before { background: var(--status-on); box-shadow: 0 0 8px var(--status-on); }
        
        .status-offline { background: var(--status-off-glow); color: var(--status-off); border: 1px solid var(--status-off); }
        .status-offline::before { background: var(--status-off); }

        .bot-details { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        .detail-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 8px; }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .detail-value { font-weight: 500; }

        .warn-text { color: var(--status-warn); font-weight: bold; }
        .danger-text { color: var(--status-off); font-weight: bold; }
        .safe-text { color: var(--status-on); }

        .bot-actions { display: flex; gap: 10px; margin-top: auto; }
        .btn {
            flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4752c4; }
        .btn-secondary { background: var(--bg-surface); color: white; border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }

        /* Loader */
        .loader-container { width: 100%; text-align: center; padding: 50px; grid-column: 1 / -1; }
        .spinner { animation: spin 1s linear infinite; color: var(--primary); width: 40px; height: 40px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ===== FOOTER ===== */
        footer {
            background: var(--bg-surface); padding: 40px 20px;
            text-align: center; border-top: 1px solid var(--border); margin-top: 60px;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
            .sidebar { position: relative; top: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="badge" id="sync-status">
            <i data-lucide="refresh-cw" size="14"></i> Sincronizando com Firebase...
        </div>
        <h1>Painel de Aplicações</h1>
        <p>Monitore o status dos seus bots, servidores e administre as mensalidades em tempo real de forma centralizada.</p>
    </header>

    <div class="search-container">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="searchInput" placeholder="Buscar bot pelo nome ou ID...">
    </div>

    <div class="main-grid">
        <aside class="sidebar">
            <div class="nav-card">
                <h3>Filtros Rápidos</h3>
                <nav id="sidebar-nav">
                    <button class="nav-link active" data-filter="all">
                        <div class="nav-left"><i data-lucide="layout-grid"></i> Todos os Bots</div>
                        <span class="nav-count" id="count-all">0</span>
                    </button>
                    <button class="nav-link" data-filter="online">
                        <div class="nav-left"><i data-lucide="power" style="color: var(--status-on)"></i> Online</div>
                        <span class="nav-count" id="count-online">0</span>
                    </button>
                    <button class="nav-link" data-filter="offline">
                        <div class="nav-left"><i data-lucide="power-off" style="color: var(--status-off)"></i> Offline</div>
                        <span class="nav-count" id="count-offline">0</span>
                    </button>
                    <button class="nav-link" data-filter="expiring">
                        <div class="nav-left"><i data-lucide="clock" style="color: var(--status-warn)"></i> Vencendo (≤ 5 dias)</div>
                        <span class="nav-count" id="count-expiring">0</span>
                    </button>
                </nav>
            </div>
        </aside>

        <main class="content-area">
            
            <div class="top-stats">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--status-on-glow); color: var(--status-on);">
                        <i data-lucide="server"></i>
                    </div>
                    <div class="stat-info">
                        <h4>Ativos</h4>
                        <span id="stat-online">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--status-off-glow); color: var(--status-off);">
                        <i data-lucide="server-crash"></i>
                    </div>
                    <div class="stat-info">
                        <h4>Inativos</h4>
                        <span id="stat-offline">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--status-warn-glow); color: var(--status-warn);">
                        <i data-lucide="calendar-alert"></i>
                    </div>
                    <div class="stat-info">
                        <h4>A Vencer</h4>
                        <span id="stat-expiring">0</span>
                    </div>
                </div>
            </div>

            <div class="bots-grid" id="botsContainer">
                <div class="loader-container">
                    <i data-lucide="loader-2" class="spinner"></i>
                    <p style="margin-top: 15px; color: var(--text-muted);">Buscando dados no banco...</p>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p style="color: var(--text-muted); font-size: 14px;">© 2026 Smart Applications. Conectado ao Firebase.</p>
    </footer>

    <script>
        // Inicializa Ícones
        lucide.createIcons();

        // Configuração do Firebase REST API
        // Usa o ".json" no final para permitir que a API REST do Firebase retorne os dados
        const FIREBASE_URL = "https://banco-de-da-4c639-default-rtdb.firebaseio.com/bots.json";
        
        let botsData = [];
        let currentFilter = 'all';

        // Dados falsos de fallback caso o Firebase esteja vazio ou dê erro (ex: regras de segurança)
        const mockData = {
            "bot_001": { nome: "Moderação Suprema", status: "online", vencimento: "2026-05-15", plano: "Premium" },
            "bot_002": { nome: "Musicfy Bot", status: "online", vencimento: "2026-04-20", plano: "Básico" },
            "bot_003": { nome: "Economia Global", status: "offline", vencimento: "2026-04-10", plano: "Pro" },
            "bot_004": { nome: "Ticket System", status: "online", vencimento: "2026-06-01", plano: "Premium" },
            "bot_005": { nome: "Raid Protect", status: "offline", vencimento: "2026-05-05", plano: "Básico" }
        };

        // Função para formatar data (Ex: 2026-05-15 -> 15/05/2026)
        function formatData(dataISO) {
            if(!dataISO) return "Não definido";
            const partes = dataISO.split('-');
            if(partes.length !== 3) return dataISO;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // Função para calcular dias restantes
        function calcularDiasRestantes(dataVencimento) {
            if(!dataVencimento) return 999;
            const hoje = new Date();
            const venc = new Date(dataVencimento);
            hoje.setHours(0,0,0,0);
            venc.setHours(0,0,0,0);
            const diffTime = venc - hoje;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // Função Principal de Carregamento
        async function fetchBots() {
            const syncBadge = document.getElementById('sync-status');
            
            try {
                const response = await fetch(FIREBASE_URL);
                if (!response.ok) throw new Error("Erro na rede ou permissão negada.");
                
                let data = await response.json();
                
                // Se o banco estiver vazio, usa os dados de exemplo para demonstração
                if (!data) {
                    console.warn("Banco vazio. Usando dados de demonstração.");
                    data = mockData;
                }

                // Transforma o Objeto do Firebase em um Array
                botsData = Object.keys(data).map(key => {
                    const bot = data[key];
                    const dias = calcularDiasRestantes(bot.vencimento);
                    return {
                        id: key,
                        nome: bot.nome || "Bot Sem Nome",
                        status: (bot.status || "offline").toLowerCase(),
                        vencimento: bot.vencimento || "",
                        plano: bot.plano || "Padrão",
                        diasRestantes: dias,
                        isExpiring: dias <= 5 && dias >= 0,
                        isExpired: dias < 0
                    };
                });

                syncBadge.innerHTML = `<i data-lucide="check-circle" size="14"></i> Sincronizado`;
                syncBadge.style.color = "var(--status-on)";
                syncBadge.style.borderColor = "var(--status-on)";
                syncBadge.style.background = "var(--status-on-glow)";

                atualizarContadores();
                renderBots();

            } catch (error) {
                console.error("Erro ao buscar do Firebase:", error);
                
                // Fallback de demonstração em caso de erro de CORS/Permissão
                botsData = Object.keys(mockData).map(key => {
                    const bot = mockData[key];
                    const dias = calcularDiasRestantes(bot.vencimento);
                    return {
                        id: key, nome: bot.nome, status: bot.status,
                        vencimento: bot.vencimento, plano: bot.plano,
                        diasRestantes: dias, isExpiring: dias <= 5 && dias >= 0, isExpired: dias < 0
                    };
                });
                
                syncBadge.innerHTML = `<i data-lucide="alert-triangle" size="14"></i> Modo Offline (Demo)`;
                syncBadge.style.color = "var(--status-warn)";
                atualizarContadores();
                renderBots();
            }
            lucide.createIcons();
        }

        // Atualizar números no sidebar e topo
        function atualizarContadores() {
            const on = botsData.filter(b => b.status === 'online').length;
            const off = botsData.filter(b => b.status === 'offline').length;
            const exp = botsData.filter(b => b.isExpiring || b.isExpired).length;

            document.getElementById('count-all').innerText = botsData.length;
            document.getElementById('count-online').innerText = on;
            document.getElementById('count-offline').innerText = off;
            document.getElementById('count-expiring').innerText = exp;

            document.getElementById('stat-online').innerText = on;
            document.getElementById('stat-offline').innerText = off;
            document.getElementById('stat-expiring').innerText = exp;
        }

        // Renderizar a Grid de Bots
        function renderBots(searchTerm = "") {
            const container = document.getElementById('botsContainer');
            container.innerHTML = "";

            let filtrados = botsData.filter(bot => {
                // Filtro do menu lateral
                if (currentFilter === 'online' && bot.status !== 'online') return false;
                if (currentFilter === 'offline' && bot.status !== 'offline') return false;
                if (currentFilter === 'expiring' && !(bot.isExpiring || bot.isExpired)) return false;
                
                // Filtro de busca
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    return bot.nome.toLowerCase().includes(term) || bot.id.toLowerCase().includes(term);
                }
                return true;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
                        <i data-lucide="inbox" size="40" style="margin-bottom: 10px; opacity: 0.5;"></i>
                        <p>Nenhum bot encontrado com estes filtros.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filtrados.forEach(bot => {
                const isOnline = bot.status === 'online';
                
                // Lógica visual da mensalidade
                let vencimentoColorClass = "safe-text";
                let vencimentoTexto = `${bot.diasRestantes} dias`;
                
                if (bot.isExpired) {
                    vencimentoColorClass = "danger-text";
                    vencimentoTexto = `Vencido há ${Math.abs(bot.diasRestantes)} dias!`;
                } else if (bot.isExpiring) {
                    vencimentoColorClass = "warn-text";
                    vencimentoTexto = bot.diasRestantes === 0 ? "Vence Hoje!" : `Em ${bot.diasRestantes} dias`;
                }

                const card = document.createElement('div');
                card.className = 'bot-card';
                card.innerHTML = `
                    <div class="${isOnline ? 'status-badge status-online' : 'status-badge status-offline'}">
                        ${isOnline ? 'Online' : 'Offline'}
                    </div>

                    <div class="bot-header">
                        <div class="bot-avatar">
                            <i data-lucide="bot" size="28" style="color: ${isOnline ? 'var(--status-on)' : 'var(--text-muted)'}"></i>
                        </div>
                        <div class="bot-title">
                            <h3>${bot.nome}</h3>
                            <span class="bot-id">ID: ${bot.id}</span>
                        </div>
                    </div>

                    <div class="bot-details">
                        <div class="detail-row">
                            <span class="detail-label"><i data-lucide="credit-card" size="14"></i> Plano</span>
                            <span class="detail-value">${bot.plano}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label"><i data-lucide="calendar" size="14"></i> Data Final</span>
                            <span class="detail-value">${formatData(bot.vencimento)}</span>
                        </div>
                        <div class="detail-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
                            <span class="detail-label">Status Financeiro</span>
                            <span class="detail-value ${vencimentoColorClass}">${vencimentoTexto}</span>
                        </div>
                    </div>

                    <div class="bot-actions">
                        <button class="btn btn-secondary" title="Reiniciar Aplicação">
                            <i data-lucide="rotate-cw" size="16"></i>
                        </button>
                        <button class="btn btn-primary">
                            <i data-lucide="settings" size="16"></i> Gerenciar
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        // Lógica de Busca e Filtros
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderBots(e.target.value);
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-link').forEach(nav => nav.classList.remove('active'));
                const btn = e.currentTarget;
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderBots(document.getElementById('searchInput').value);
            });
        });

        // Inicia a aplicação
        fetchBots();

    </script>
</body>
</html>
